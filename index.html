<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Little Flame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0A0A0A;
    --page-color: #FFFFFF;
    --text-color: #000000;
    --accent-color: #FF3B00; /* Swiss Red */
    --grid-line: rgba(0,0,0,0.1);
    --ph-bg: #EDEDED;
    --ph-fg: #999;
    --muted: #888;

    --text-size: 0.85rem;
    --line-height: 1.6;
  }
  :root[data-theme="dark"] {
    --bg-color: #050403;
    --page-color: #1A1714;
    --text-color: #EFE9DF;
    --grid-line: rgba(255,255,255,0.1);
    --ph-bg: #2A2521;
    --ph-fg: #6F655B;
    --muted: #9A8F84;
  }

  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-color);
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    overflow: hidden; color: var(--text-color);
    transition: background-color 0.4s;
  }
  button { font-family: inherit; }
  #embers { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #stage { position: fixed; inset: 0; z-index: 10; }

  /* -------------------------------------------
     SWISS TYPOGRAPHY
  -------------------------------------------- */
  h1 {
    font-size: clamp(3.5rem, 8vw, 5.5rem);
    font-weight: 900; line-height: 0.85;
    letter-spacing: -0.04em; text-transform: uppercase;
    margin: 0; text-align: left; color: var(--text-color);
  }
  h1 span { color: var(--accent-color); display: block; }

  .instruction-text {
    font-weight: 700; letter-spacing: 1.5px; font-size: 0.75rem;
    color: var(--muted); text-transform: uppercase; margin: 24px 0 0 0;
  }
  .again {
    margin-top: 28px; padding: 14px 22px; background: var(--accent-color); color: #fff; border: none;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
  }
  .again:focus-visible { outline: 2px solid var(--text-color); outline-offset: 3px; }

  .story-text, .dialogue-text {
    font-family: 'Inter', Helvetica, Arial, sans-serif; font-size: var(--text-size); line-height: var(--line-height);
    font-weight: 500; letter-spacing: 0; font-kerning: normal; text-align: left; color: var(--text-color);
  }
  .story-text { margin: 0 0 0.9em 0; }
  .dialogue-text { margin: 0; }
  .dialogue-text strong {
    font-weight: 900; text-transform: uppercase; font-size: 0.85em;
    margin-right: 6px; color: var(--accent-color);
  }

  /* -------------------------------------------
     ILLUSTRATION BOXES
     .img-bg is the picture (cover-fit, so nothing is ever stretched).
     Spread-wide pictures are one oversized .img-bg shifted inside each half.
  -------------------------------------------- */
  .img-box {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background-color: var(--ph-bg);
  }
  .img-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity 0.9s ease;
  }
  .img-ready { background-color: transparent; }
  .img-ready .img-bg { opacity: 1; }
  .img-ready .ph { display: none; }
  .ph { position: relative; text-align: center; padding: 0 10px; color: var(--ph-fg); font-weight: 700; font-size: 0.85rem; letter-spacing: 2px; }

  /* -------------------------------------------
     DESKTOP ENGINE (FLUID GRID SPREADS)
  -------------------------------------------- */
  .desktop-scene {
    width: 1000px; height: 640px; perspective: 3000px; position: absolute;
    top: calc(50% - 6px); left: 50%; transform: translate(-50%, -50%) scale(var(--s, 1));
    cursor: pointer;
  }
  .desktop-book {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  .desktop-page {
    width: 50%; height: 100%; position: absolute; right: 0;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  .desktop-page.flipped { transform: rotateY(-180deg); }
  .desktop-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; background-color: var(--page-color);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.03);
  }
  .desktop-face::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .desktop-front::after { background: linear-gradient(to right, rgba(0,0,0,0.16), transparent 12%); }
  .desktop-back::after { background: linear-gradient(to left, rgba(0,0,0,0.16), transparent 12%); }
  .desktop-front { transform: rotateY(0deg); border-left: 0.25px solid var(--grid-line); }
  .desktop-back { transform: rotateY(180deg); }

  .cover-container {
    padding: 60px 50px; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: flex-start; height: 100%;
  }
  /* Cover picture (images/cover.jpg): sits above the title, in the height left over by the title. */
  .cover-container.has-art { padding-top: 50px; padding-bottom: 50px; }
  .cover-art { flex: 1 1 0; min-height: 0; width: 100%; position: relative; margin-bottom: 28px; }
  /* The whole picture is shown (never cropped), centred in the space above the title */
  .cover-art .img-bg { top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center center; }
  .cover-title { position: relative; }

  /* Credits */
  .credits { padding: 60px 50px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; }
  .credits-title { font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); margin: 0 0 36px; }
  .credit { margin: 0 0 28px; }
  .credit-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .credit-name { font-size: 1.15rem; font-weight: 900; line-height: 1.25; letter-spacing: -0.01em; margin: 0; }
  .credit-year { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }

  /* Layout 1: Classic Split. The portrait picture is shown whole, full height, against the outer edge */
  .l1-left { padding: 40px 50px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; overflow-y: auto; }
  .l1-right { width: 100%; height: 100%; }
  .l1-right .img-bg { background-size: contain; background-position: right center; }

  /* Layout 2: Picture runs across the spine (300px on the left page + 500px on the right = 800 x 450, whole 16:9),
     its bottom edge aligned with the bottom of the text column */
  .l2-left { display: flex; width: 100%; height: 100%; align-items: flex-start; }
  .l2-text { width: 40%; height: 100%; padding: 40px 26px; display: flex; flex-direction: column; justify-content: flex-end; border-right: 1px solid var(--grid-line); overflow-y: auto; }
  .l2-img { width: 60%; height: 450px; margin-top: 150px; }
  .l2-right { width: 100%; height: 450px; margin-top: 150px; }

  /* Layout 3: Panorama across both pages, text set in two columns along the bottom.
     --strip (set by fitStrips) is only as tall as the text needs, so the picture shows almost whole */
  .l3-left, .l3-right { display: flex; flex-direction: column; height: 100%; width: 100%; }
  .l3-img { flex: 1; min-height: 0; border-bottom: 2px solid var(--text-color); }
  .l3-text { flex: none; height: var(--strip, 120px); padding: 16px 30px 0 50px; overflow-y: auto; }
  .l3-right .l3-text { padding: 16px 50px 0 30px; }
  .l3-text p:last-child { margin-bottom: 0; }

  /* Layout 4: Full Bleed with Swiss Box */
  .l4-left, .l4-right { width: 100%; height: 100%; }
  .l4-box {
    position: absolute; bottom: 40px; left: 40px; width: 340px; max-height: calc(100% - 80px); overflow-y: auto;
    background: var(--page-color); color: var(--text-color); padding: 30px; border-top: 4px solid var(--accent-color);
  }
  /* box: 'right' puts a wide, low box in the bottom-right corner of the right page */
  .l4-box.br { left: auto; right: 30px; bottom: 30px; width: 420px; padding: 20px 24px; }
  .l4-box p:last-child { margin-bottom: 0; }
  /* box: 'wide' sets the text in a low strip across both pages (one half on each page) */
  .l4-box.wide { bottom: 30px; max-height: none; overflow: visible; padding: 18px 28px 14px; }
  .l4-left .l4-box.wide { left: 30px; right: 0; width: auto; border-top-right-radius: 0; }
  .l4-right .l4-box.wide { left: 0; right: 30px; width: auto; }

  /* -------------------------------------------
     MOBILE ENGINE (FLUID STACK)
  -------------------------------------------- */
  .mobile-scene { position: absolute; inset: 0; perspective: 2500px; touch-action: manipulation; }
  .mobile-book { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
  .mobile-page {
    width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.645, 0.045, 0.355, 1);
    background-color: var(--page-color); backface-visibility: hidden;
  }
  .mobile-page.flipped { transform: rotateY(-180deg); }

  .m-l1-text { padding: 100px 40px 70px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; overflow-y: auto; }
  .m-l1-img { height: 100%; width: 100%; }

  .m-l2 { display: flex; flex-direction: column; height: 100%; }
  .m-l2-text { height: 45%; padding: 80px 30px 30px; display: flex; flex-direction: column; justify-content: flex-end; overflow-y: auto; }
  .m-l2-img { height: 55%; border-top: 2px solid var(--accent-color); }

  .m-l3 { display: flex; flex-direction: column; height: 100%; }
  .m-l3-img { height: 55%; border-bottom: 2px solid var(--text-color); }
  .m-l3-text { height: 45%; padding: 30px 30px 60px; display: flex; flex-direction: column; justify-content: flex-start; overflow-y: auto; }

  .m-l4 { display: flex; flex-direction: column; height: 100%; }
  .m-l4-img { height: 52%; flex: none; }
  .m-l4-text {
    flex: 1; padding: 26px 30px 56px; overflow-y: auto; display: flex; flex-direction: column;
    justify-content: flex-start; border-top: 4px solid var(--accent-color);
  }

  /* Applied while jumping to a position without animation */
  .instant, .instant .desktop-page, .instant .mobile-page { transition: none !important; }

  /* -------------------------------------------
     UI COMPONENTS
  -------------------------------------------- */
  .ui-bar {
    position: fixed; top: 0; left: 0; width: 100%; padding: 16px 20px; display: flex;
    justify-content: space-between; align-items: center; z-index: 100; pointer-events: none;
  }
  .ui-group { display: flex; gap: 8px; }
  .ui-btn {
    appearance: none; padding: 0; border: 1px solid rgba(255,255,255,0.16);
    background: rgba(20,20,20,0.92); color: #F2F2F2; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto;
    font-size: 0.9rem; font-weight: 700; border-radius: 2px; transition: background 0.2s;
  }
  .ui-btn:hover { background: #2E2E2E; }
  .ui-btn:focus-visible, .progress:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }
  .ui-btn.on { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
  .ui-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #btn-bookmark.on svg { fill: currentColor; }
  .ui-counter {
    font-weight: 700; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; font-variant-numeric: tabular-nums;
    background: rgba(20,20,20,0.92); color: #F2F2F2; padding: 8px 12px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.16); white-space: nowrap;
  }

  /* Progress bar: click or drag anywhere along it to jump */
  .progress {
    position: fixed; left: 0; right: 0; bottom: 0; height: 36px; z-index: 100; cursor: pointer; touch-action: none;
    display: flex; align-items: flex-end;
  }
  .progress-track {
    position: relative; width: 100%; height: 4px; margin-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(128,128,128,0.45); transition: height 0.2s;
  }
  .progress:hover .progress-track, .progress.drag .progress-track { height: 8px; }
  .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--accent-color); }
  .progress-tick { position: absolute; top: 0; width: 2px; height: 100%; margin-left: -1px; background: rgba(10,10,10,0.5); }
  .progress-thumb {
    position: absolute; top: 50%; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-color);
    border: 2px solid #fff; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(255,59,0,0.7); pointer-events: none;
  }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 150; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; width: min(100%, 560px); max-height: 80vh; overflow-y: auto;
    background: #141414; color: #F2F2F2; padding: 32px 28px calc(28px + env(safe-area-inset-bottom, 0px));
    z-index: 151; transform: translate(-50%, 105%); visibility: hidden;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s 0.4s;
  }
  .sheet.active { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }
  .sheet h3 { margin: 0 0 24px 0; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
  .slider-group { margin-bottom: 26px; }
  .slider-group label { display: block; text-transform: uppercase; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: #8E8E8E; margin-bottom: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent-color); }
  .toggle {
    display: flex; justify-content: space-between; align-items: center; padding: 14px 0; cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  .toggle input {
    appearance: none; -webkit-appearance: none; width: 44px; height: 24px; border-radius: 12px; background: #4A4A4A;
    position: relative; cursor: pointer; margin: 0; transition: background 0.2s; flex: none;
  }
  .toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
  .toggle input:checked { background: var(--accent-color); }
  .toggle input:checked::after { transform: translateX(20px); }
  .toggle input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .close-settings {
    width: 100%; padding: 16px; margin-top: 20px; background: var(--accent-color); color: #fff; border: none;
    font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
  }

  .toc { list-style: none; margin: 0; padding: 0; }
  .toc button {
    display: flex; gap: 16px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0;
    border-top: 1px solid rgba(255,255,255,0.1); color: inherit; font-size: 0.85rem; font-weight: 500; line-height: 1.4; padding: 14px 0; cursor: pointer;
  }
  .toc button:hover .t { text-decoration: underline; }
  .toc-part { padding: 22px 0 8px; font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8E8E8E; }
  .toc .n { color: var(--accent-color); font-weight: 900; min-width: 28px; font-variant-numeric: tabular-nums; }
  .toc .bm { margin-left: auto; font-size: 0.6rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-color); }
  .toc button[aria-current="true"] .t { font-weight: 900; }
  .toc button[aria-current="true"] { background: rgba(255,59,0,0.12); }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: var(--accent-color); color: #fff; padding: 12px 24px;
    font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; z-index: 200;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .desktop-page, .mobile-page, .desktop-book { transition-duration: 0.01s; }
    .img-bg { transition-duration: 0.01s; }
  }
</style>
</head>
<body>

<canvas id="embers" aria-hidden="true"></canvas>
<main id="stage" aria-label="The Little Flame storybook"></main>
<div id="ui"></div>

<script>
  // Story script. layout: 1 = text | picture, 2 = text + picture across the spine,
  // 3 = panorama on top, 4 = full-bleed picture with a text box.
  // Pictures load automatically from images/01.jpg ... images/27.jpg (see IMAGE_DIR / IMAGE_EXT below).
  // title is the chapter name shown in Contents; PARTS groups the chapters.
  // Optional per-spread fields: img (custom path), focus (desktop crop focus, e.g. "50% 30%"),
  // mfocus (phone crop focus; phones show a tall slice of wide pictures), box: 'right' (low box in the bottom-right corner on desktop) or 'wide' (low strip across both pages).
  const spreads = [
    {
      layout: 4,
      title: "The Seven Fire Horses",
      story: "A volcano erupts, shooting fire into the night. From the roaring light, seven fire horses emerge and run high in the burning sky. Wherever they gallop, the world catches light. They are not cruel. They are only wild, and the world below has grown careless with the wild things.",
      mfocus: "60% 50%",
    },
    {
      layout: 1,
      title: "Something Small Falling",
      story: "As they pass, two of the horses slow. They look back, down into the smoke, at something small falling toward the forest. Then they run on, and are gone.",
    },
    {
      layout: 3,
      title: "A Spark Under the Redwood",
      story: "The rain comes after, the way it always does. But under the oldest tree in the forest, in a small, dry pocket of the world, a little flame blinks awake. It does not know how it got here. It does not know what it is.",
    },
    {
      layout: 2,
      title: "The First Touch",
      story: "The little flame reaches out to touch the world. The earth goes black beneath its fingers. It pulls back, afraid of the mark it left.",
      dialogue: "<strong>Flame</strong> “What… am I?”<br><strong>Redwood</strong> “You are alive.”",
      mfocus: "25% 50%",
    },
    {
      layout: 1,
      title: "Not the Whole Story",
      story: "“Then I am dangerous,” the little flame whispers.\nThe old tree takes a long time to answer, the way old things do. “Water can drown,” it says at last. “Wind can level a mountain. Dangerous is not the whole story.”",
    },
    {
      layout: 4,
      title: "The Glowing Mountain",
      story: "Far away, through the clearing smoke, a mountain glows. The little flame has never seen it before. And yet, somehow, it feels the pull of it, like a string tied to its heart.\n“I know that place,” it says. “I don’t know how I know it. But I do.”",
      mfocus: "78% 50%",
    },
    {
      layout: 3,
      title: "Burning and Caring",
      story: "The little flame wants to go. But it is afraid.\n“What if I burn something on the way?” it asks. “What if I burn someone who is trying to help me?”\n“That is a question worth carrying,” the redwood says. “It means you already know the difference between burning and caring.”",
      focus: "50% 100%",
    },
    {
      layout: 2,
      title: "A Black Shape Drops Down",
      story: "“I cannot go with you,” says the tree. “But I know someone who moves faster than I do.”\nThe redwood’s leaves stir, a low whistle meant for a friend. And out of the smoke, a black shape drops down.",
      mfocus: "30% 50%",
    },
    {
      layout: 1,
      title: "The Crow",
      story: "The crow looks the little flame over, head tilting left, then right.",
      dialogue: "<strong>Crow</strong> “It’s on fire.”<br><strong>Redwood</strong> “It is fire.”<br><strong>Crow</strong> “…There’s a difference?”",
    },
    {
      layout: 4,
      title: "We Are Up",
      story: "The crow understands the problem at once. The flame cannot walk. And anything that carries it will burn. So the crow lifts a branch in his talons, and the little flame perches on the far end like a small bright lantern. Wobbling, uncertain, they rise.",
      dialogue: "<strong>Flame</strong> “We are UP!”<br><strong>Crow</strong> “Yes. We are up. Please stop wiggling.”",
      mfocus: "30% 50%",
      box: "right",
    },
    {
      layout: 3,
      title: "The Quiet Marsh",
      story: "But the branch burns short, and the crow cannot fly far enough. They come down at the edge of a quiet marsh, a hidden, tended place, where a pair of dark eyes is watching from the reeds.",
      mfocus: "35% 50%",
    },
    {
      layout: 1,
      title: "The Monkey's Story",
      story: "The monkey steps out slowly. He was kept once, he tells them, caged by humans for a long time. Then the great burning came. The people ran. The cages were forgotten. And he ran too, until he found this marsh that no one had claimed.",
      dialogue: "<strong>Flame</strong> “The fire gave you this?”<br><strong>Monkey</strong> “The fire gave me everything.”",
    },
    {
      layout: 2,
      title: "The Green Branch",
      story: "The monkey breaks off a long green branch, one that will not burn so fast, and holds it out. “You’re afraid of yourself,” he says quietly. “I can see it. You learn to carry what you are.”\nAnd so they go on: the crow, the eye in the sky; the monkey, the steady hands below; the little flame, the light between them.",
      mfocus: "50% 50%",
    },
    {
      layout: 4,
      title: "The First Campfire",
      story: "That night they are cold, so the little flame does something new. It touches a small nest of wood inside a ring of stones, and a warm fire blooms. Its own warmth, set gently into the world, harming nothing.",
      dialogue: "<strong>Flame</strong> “Is that… me?”<br><strong>Monkey</strong> “Part of you. The part you gave.”",
      mfocus: "58% 50%",
    },
    {
      layout: 3,
      title: "The Flame Laughs",
      story: "“I burned a forest,” the little flame says.\n“The horses burned a forest,” says the crow. “You survived one.”\n“Tonight,” says the monkey, “you are keeping us warm. Tonight nothing is afraid of you.”\nAnd for the first time, the little flame laughs with a small, crackling sound, like a fresh log catching light.",
      focus: "50% 70%",
    },
    {
      layout: 1,
      title: "Under the Stars",
      story: "Later, the little flame looks up at the stars. “Do you think they can see us? The fire horses?”\n“I think they see everything from up there,” says the monkey.\n“I hope they know I’m coming,” says the little flame softly.",
    },
    {
      layout: 2,
      title: "The Foot of the Mountain",

      box: "wide",

  const PARTS = [
    { from: 0, name: 'Part One · The Forest' },
    { from: 7, name: 'Part Two · The Journey' },
    { from: 16, name: 'Part Three · The Mountain' },
    { from: 23, name: 'Part Four · The Sky' }
  ];

  // --------------------------------------------------
  //  HELPERS & PREFERENCES
  // --------------------------------------------------
  const IMAGE_DIR = 'images/';
  const IMAGE_EXT = 'jpg';
  const COVER_IMAGE = IMAGE_DIR + 'cover.' + IMAGE_EXT;   // optional cover picture
  const N = spreads.length;

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const pad = n => String(n).padStart(2, '0');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const prefs = Object.assign(
    { size: 0.85, line: 1.6, dark: false, embers: true },
    (() => { try { return JSON.parse(store.get('lf-prefs-v2')) || {}; } catch (e) { return {}; } })()
  );
  const savePrefs = () => store.set('lf-prefs-v2', JSON.stringify(prefs));

  function applyPrefs() {
    const r = document.documentElement;
    r.dataset.theme = prefs.dark ? 'dark' : 'light';
    r.style.setProperty('--text-size', `${prefs.size}rem`);
    r.style.setProperty('--line-height', prefs.line);
    fitStrips();
  }

  // --------------------------------------------------
  //  STATE
  //  idx is the single source of truth for "where are we".
  //  Desktop: 0 = closed cover, k (1..N) = spread k-1, N+1 = back cover.
  //  Mobile:  idx = index of the visible page (some spreads take two pages).
  // --------------------------------------------------
  const stage = $('stage');
  let isMob = checkMob();
  let idx = 0, maxIdx = 0, pages = [], starts = [], bookEl = null, sceneEl = null;

  function checkMob() { return window.innerWidth <= 768 || window.innerHeight > window.innerWidth * 1.15; }

  // spread numbers: -1 = cover, 0..N-1 = story, N = The End, N+1 = Credits (its own page on phones;
  // on desktop the credits face The End, so both live on the final spread)
  function idxOfSpread(s) {
    if (s < 0) return 0;
    if (!isMob) return s >= N ? maxIdx : s + 1;
    if (s >= N + 1) return maxIdx;
    if (s === N) return maxIdx - 1;
    return starts[s];
  }
  function spreadOf(i) {
    if (i <= 0) return -1;
    if (!isMob) return i >= maxIdx ? N : i - 1;
    if (i >= maxIdx) return N + 1;
    if (i === maxIdx - 1) return N;
    let s = 0;
    for (let k = 0; k < N; k++) if (starts[k] <= i) s = k;
    return s;
  }

  // --------------------------------------------------
  //  ILLUSTRATIONS (auto-loaded, fade in, placeholders stay until they exist)
  // --------------------------------------------------
  const imgCache = {};
  function loadImage(i) {
    if (imgCache[i]) return imgCache[i];
    const src = spreads[i].img || `${IMAGE_DIR}${pad(i + 1)}.${IMAGE_EXT}`;
    return imgCache[i] = new Promise(res => {
      const im = new Image();
      im.onload = () => res(src);
      im.onerror = () => res(null);
      im.src = src;
    });
  }
  function applyImages() {
    new Promise(res => { const im = new Image(); im.onload = () => res(COVER_IMAGE); im.onerror = () => res(null); im.src = COVER_IMAGE; })
      .then(src => {
        if (!src) return;
        document.querySelectorAll('.img-bg[data-img="cover"]').forEach(bg => {
          bg.style.backgroundImage = `url("${src}")`;
          bg.parentElement.classList.add('img-ready');
          bg.closest('.cover-container').classList.add('has-art');
        });
      });
    const cur = Math.max(0, Math.min(N - 1, spreadOf(idx)));
    Array.from({ length: N }, (_, i) => i)
      .sort((a, b) => Math.abs(a - cur) - Math.abs(b - cur))
      .forEach(i => loadImage(i).then(src => {
        if (!src) return;
        document.querySelectorAll(`.img-bg[data-img="${i}"]`).forEach(bg => {
          bg.style.backgroundImage = `url("${src}")`;
          bg.parentElement.classList.add('img-ready');
        });
      }));
  }

  // --------------------------------------------------
  //  PAGE GENERATORS
  // --------------------------------------------------
  // A line break (\n) in the story starts a new paragraph, e.g. for each new speaker
  const paras = text => text.split('\n').map(p => `<p class="story-text">${p}</p>`).join('');

  function buildText(spread) {
    let t = paras(spread.story);
    if (spread.dialogue) t += `<p class="dialogue-text">${spread.dialogue}</p>`;
    return t;
  }

  // A picture region. bgStyle positions the (possibly oversized) picture inside the box.
  function imgBox(cls, i, bgStyle = '', inner = '') {
    const f = isMob ? spreads[i].mfocus : spreads[i].focus;
    const focus = f ? `background-position:${f};` : '';
    return `<div class="img-box ${cls}"><div class="img-bg" data-img="${i}" style="${bgStyle}${focus}"></div><span class="ph">[ ILLUSTRATION ${i + 1} ]</span>${inner}</div>`;
  }

  // Layout 3 text is set in two columns, one per page: story | dialogue, or the story split at a sentence break
  function splitColumns(s) {
    if (s.dialogue) return [paras(s.story), `<p class="dialogue-text">${s.dialogue}</p>`];
    // split between paragraphs when there are several, otherwise at a sentence break
    const sep = s.story.includes('\n') ? '\n' : ' ';
    const parts = sep === '\n' ? s.story.split('\n') : s.story.split(/(?<=[.!?][”"]?)\s+(?=[A-Z“"])/);
    const a = [];
    let len = 0;
    while (parts.length > 1 && len + parts[0].length / 2 < s.story.length / 2) { len += parts[0].length; a.push(parts.shift()); }
    return [paras(a.join(sep)), paras(parts.join(sep))];
  }

  // Sizes each layout-3 text strip to its text (same height on both pages so the picture lines up across the spine)
  function fitStrips() {
    if (isMob) return;
    stage.querySelectorAll('.l3-left').forEach(left => {
      const right = stage.querySelector(`.l3-right[data-spread="${left.dataset.spread}"]`);
      const cols = [left, right].filter(Boolean).map(c => c.querySelector('.l3-text'));
      cols.forEach(c => c.style.height = 'auto');
      const h = clamp(Math.max(...cols.map(c => c.offsetHeight)) + 16, 90, 260);
      cols.forEach(c => c.style.height = '');
      [left, right].filter(Boolean).forEach(c => c.style.setProperty('--strip', `${h}px`));
    });
    const wide = {};
    stage.querySelectorAll('.l4-box.wide').forEach(b => { b.style.height = 'auto'; (wide[b.dataset.spread] = wide[b.dataset.spread] || []).push(b); });
    Object.values(wide).forEach(pair => {
      const h = Math.max(...pair.map(b => b.offsetHeight));
      pair.forEach(b => b.style.height = `${h}px`);
    });
  }

  const coverArt = () => `<div class="cover-art"><div class="img-bg" data-img="cover"></div></div>`;
  const coverFront = () => `<div class="cover-container">${coverArt()}<div class="cover-title"><h1>The Little<br><span>Flame</span></h1><p class="instruction-text">Click, or press → to open</p></div></div>`;
  const creditsPage = (again = false) => `<div class="credits">
    <p class="credits-title">The Little Flame</p>
    <div class="credit"><p class="credit-label">Story, Edit, Art Direction</p><p class="credit-name">Eric Park</p></div>
    <div class="credit"><p class="credit-label">AI Tools</p><p class="credit-name">Gemini, Claude, Google Flow</p></div>
    <p class="credit-year">Published 2026</p>${again ? '<button class="again" type="button">Read again</button>' : ''}</div>`;
  const endCover = () => `<div class="cover-container"><h1>The<br><span>End</span></h1><button class="again" type="button">Read again</button></div>`;

  function genDesktopLeft(s, i) {
    const txt = buildText(s);
    if (s.layout === 1) return `<div class="l1-left">${txt}</div>`;
    if (s.layout === 2) return `<div class="l2-left"><div class="l2-text">${txt}</div>${imgBox('l2-img', i, 'width:800px;left:0;')}</div>`;
    if (s.layout === 3) return `<div class="l3-left" data-spread="${i}">${imgBox('l3-img', i, 'width:1000px;left:0;')}<div class="l3-text">${splitColumns(s)[0]}</div></div>`;
    if (s.box === 'wide') return imgBox('l4-left', i, 'width:1000px;left:0;', `<div class="l4-box wide" data-spread="${i}">${splitColumns(s)[0]}</div>`);
    return imgBox('l4-left', i, 'width:1000px;left:0;', s.box === 'right' ? '' : `<div class="l4-box">${txt}</div>`);
  }
  function genDesktopRight(s, i) {
    if (s.layout === 1) return imgBox('l1-right', i);
    if (s.layout === 2) return imgBox('l2-right', i, 'width:800px;left:-300px;');
    if (s.layout === 3) return `<div class="l3-right" data-spread="${i}">${imgBox('l3-img', i, 'width:1000px;left:-500px;')}<div class="l3-text">${splitColumns(s)[1]}</div></div>`;
    if (s.box === 'wide') return imgBox('l4-right', i, 'width:1000px;left:-500px;', `<div class="l4-box wide" data-spread="${i}">${splitColumns(s)[1]}</div>`);
    return imgBox('l4-right', i, 'width:1000px;left:-500px;', s.box === 'right' ? `<div class="l4-box br">${buildText(s)}</div>` : '');
  }

  function mountDesktop() {
    maxIdx = N + 1;
    let html = `<div class="desktop-scene" id="d-scene"><div class="desktop-book" id="d-book">`;
    for (let i = 0; i <= N + 1; i++) {
      const front = i === 0 ? coverFront() : i === N + 1 ? creditsPage() : genDesktopRight(spreads[i - 1], i - 1);
      const back = i === N + 1 ? '' : i === N ? endCover() : genDesktopLeft(spreads[i], i);
      html += `<div class="desktop-page" style="z-index:${N + 2 - i};"><div class="desktop-face desktop-front">${front}</div><div class="desktop-face desktop-back">${back}</div></div>`;
    }
    stage.innerHTML = html + `</div></div>`;
    sceneEl = $('d-scene'); bookEl = $('d-book');
    pages = Array.from(stage.querySelectorAll('.desktop-page'));
    starts = [];
    fitDesktop();
    fitStrips();
  }

  function mountMobile() {
    const list = [];
    list.push(`<div class="mobile-page cover-container">${coverArt()}<div class="cover-title"><h1>The Little<br><span>Flame</span></h1><p class="instruction-text">Swipe or tap the edge to read</p></div></div>`);
    starts = [];
    spreads.forEach((s, i) => {
      const txt = buildText(s);
      starts.push(list.length);
      if (s.layout === 1) {
        list.push(`<div class="mobile-page"><div class="m-l1-text">${txt}</div></div>`);
        list.push(`<div class="mobile-page">${imgBox('m-l1-img', i)}</div>`);
      } else if (s.layout === 2) {
        list.push(`<div class="mobile-page"><div class="m-l2"><div class="m-l2-text">${txt}</div>${imgBox('m-l2-img', i)}</div></div>`);
      } else if (s.layout === 3) {
        list.push(`<div class="mobile-page"><div class="m-l3">${imgBox('m-l3-img', i)}<div class="m-l3-text">${txt}</div></div></div>`);
      } else {
        list.push(`<div class="mobile-page"><div class="m-l4">${imgBox('m-l4-img', i)}<div class="m-l4-text">${txt}</div></div></div>`);
      }
    });
    list.push(`<div class="mobile-page cover-container"><h1>The<br><span>End</span></h1><p class="instruction-text">Swipe for credits</p></div>`);
    list.push(`<div class="mobile-page">${creditsPage(true)}</div>`);

    maxIdx = list.length - 1;
    const t = list.length;
    stage.innerHTML = `<div class="mobile-scene"><div class="mobile-book" id="m-book">` +
      list.map((pg, i) => pg.replace('class="mobile-page', `style="z-index:${t - i};" class="mobile-page`)).join('') + `</div></div>`;
    sceneEl = stage.firstElementChild; bookEl = $('m-book');
    pages = Array.from(stage.querySelectorAll('.mobile-page'));
  }

  function fitDesktop() {
    if (isMob || !sceneEl) return;
    const sc = Math.min((window.innerWidth - 48) / 1000, (window.innerHeight - 150) / 640, 1.5);
    sceneEl.style.setProperty('--s', Math.max(0.4, sc));
  }

  function mount(spreadToShow) {
    isMob ? mountMobile() : mountDesktop();
    idx = idxOfSpread(spreadToShow);
    buildTicks();
    render({ instant: true });
    applyImages();
  }

  // --------------------------------------------------
  //  RENDER: applies idx to the pages and refreshes the chrome
  // --------------------------------------------------
  function render({ instant = false, prev = null } = {}) {
    if (instant) bookEl.classList.add('instant');

    const changing = [];
    pages.forEach((p, i) => {
      const f = i < idx;
      if (p.classList.contains('flipped') !== f) changing.push([p, i, f]);
    });
    if (prev !== null && idx < prev) changing.reverse();   // turning back: top page lifts first
    const step = instant ? 0 : Math.min(45, 360 / Math.max(1, changing.length));
    changing.forEach(([p, i, f], k) => {
      p.style.transitionDelay = `${k * step}ms`;
      p.classList.toggle('flipped', f);
      if (!isMob) {
        const z = () => p.classList.contains('flipped') ? i + 1 : pages.length - i;
        if (instant) p.style.zIndex = z();
        else setTimeout(() => { p.style.zIndex = z(); }, 350 + k * step);
      }
    });

    if (!isMob) {
      // Centre the book while the front cover is closed
      bookEl.style.transform = idx === 0 ? 'translateX(-25%)' : 'translateX(0)';
      pages.forEach((p, i) => p.setAttribute('aria-hidden', (i === idx - 1 || i === idx) ? 'false' : 'true'));
    } else {
      pages.forEach((p, i) => p.setAttribute('aria-hidden', i === idx ? 'false' : 'true'));
    }

    if (instant) { void bookEl.offsetHeight; bookEl.classList.remove('instant'); }

    updateUI();
  }

  function go(i) {
    i = clamp(i, 0, maxIdx);
    if (i === idx) return;
    const prev = idx;
    idx = i;
    render({ prev });
  }
  const next = () => go(idx + 1);
  const back = () => go(idx - 1);
  const goSpread = s => go(idxOfSpread(s));

  // --------------------------------------------------
  //  UI: top bar, progress bar, contents, settings
  // --------------------------------------------------
  const ICON = {
    contents: '<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'
  };

  function mountUI() {
    $('ui').innerHTML = `
      <div class="ui-bar">
        <div class="ui-group">
          <button class="ui-btn" id="btn-contents" type="button" aria-label="Contents" title="Contents">${ICON.contents}</button>
          <button class="ui-btn" id="btn-settings" type="button" aria-label="Reading settings" title="Reading settings">Aa</button>
        </div>
        <div class="ui-counter" id="counter" aria-live="polite"></div>
        <div class="ui-group">
          <button class="ui-btn" id="btn-bookmark" type="button" aria-label="Bookmark this page" title="Bookmark this page">${ICON.bookmark}</button>
        </div>
      </div>
      <div class="progress" id="progress" role="slider" tabindex="0" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-track" id="p-track"><div class="progress-fill" id="p-fill"></div><div id="p-ticks"></div><div class="progress-thumb" id="p-thumb"></div></div>
      </div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="toc-sheet" role="dialog" aria-label="Contents">
        <h3>Contents</h3><ol class="toc" id="toc"></ol>
        <button class="close-settings" type="button" data-close>Close</button>
      </div>
      <div class="sheet" id="settings-sheet" role="dialog" aria-label="Reading settings">
        <h3>Reading</h3>
        <div class="slider-group"><label for="size-slider">Text Size</label><input type="range" id="size-slider" min="0.7" max="1.4" step="0.05"></div>
        <div class="slider-group"><label for="line-slider">Line Height</label><input type="range" id="line-slider" min="1.2" max="2.2" step="0.1"></div>
        <label class="toggle"><span>Night mode</span><input type="checkbox" id="t-dark"></label>
        <label class="toggle"><span>Floating embers</span><input type="checkbox" id="t-embers"></label>
        <button class="close-settings" type="button" data-close>Close</button>
      </div>
      <div class="toast" id="toast" role="status"></div>`;

    // sheets
    const scrim = $('scrim');
    const sheets = ['toc-sheet', 'settings-sheet'].map($);
    window.closeSheets = () => { sheets.forEach(s => s.classList.remove('active')); scrim.classList.remove('show'); };
    const openSheet = id => { closeSheets(); $(id).classList.add('active'); scrim.classList.add('show'); };
    $('btn-contents').addEventListener('click', () => { buildToc(); openSheet('toc-sheet'); const cur = document.querySelector('#toc [aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'center' }); });
    $('btn-settings').addEventListener('click', () => openSheet('settings-sheet'));
    scrim.addEventListener('click', closeSheets);
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));

    // settings
    const sz = $('size-slider'), ln = $('line-slider');
    sz.value = prefs.size; ln.value = prefs.line;
    sz.addEventListener('input', e => { prefs.size = +e.target.value; applyPrefs(); savePrefs(); });
    ln.addEventListener('input', e => { prefs.line = +e.target.value; applyPrefs(); savePrefs(); });
    $('t-dark').checked = prefs.dark; $('t-embers').checked = prefs.embers;
    $('t-dark').addEventListener('change', e => { prefs.dark = e.target.checked; applyPrefs(); savePrefs(); });
    $('t-embers').addEventListener('change', e => { prefs.embers = e.target.checked; savePrefs(); startEmbers(); });

    // progress bar: click / drag / keyboard
    const prog = $('progress'), track = $('p-track');
    let dragging = false;
    const idxFromPointer = e => {
      const r = track.getBoundingClientRect();
      return Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * maxIdx);
    };
    prog.addEventListener('pointerdown', e => { dragging = true; prog.classList.add('drag'); prog.setPointerCapture(e.pointerId); go(idxFromPointer(e)); });
    prog.addEventListener('pointermove', e => { if (dragging) go(idxFromPointer(e)); });
    const endDrag = () => { dragging = false; prog.classList.remove('drag'); };
    prog.addEventListener('pointerup', endDrag);
    prog.addEventListener('pointercancel', endDrag);

    // bookmark
    $('btn-bookmark').addEventListener('click', () => {
      const s = spreadOf(idx);
      if (s < 0 || s >= N) return toast('Turn to a page to bookmark it');
      if (getBookmark() === s) { store.del('lf-bookmark'); toast('Bookmark removed'); }
      else { store.set('lf-bookmark', s); toast(`Bookmarked page ${pad(s + 1)}`); }
      updateUI();
    });
  }

  function getBookmark() { const v = parseInt(store.get('lf-bookmark'), 10); return isNaN(v) || v < 0 || v >= N ? null : v; }

  function buildTicks() {
    $('p-ticks').innerHTML = spreads.map((_, s) => `<div class="progress-tick" style="left:${(idxOfSpread(s) / maxIdx) * 100}%"></div>`).join('');
    $('progress').setAttribute('aria-valuemax', 100);
  }

  function buildToc() {
    const title = s => s.title || s.story.replace(/[“”"]/g, '').split(/\s+/).slice(0, 9).join(' ') + '…';
    const part = i => { const p = PARTS.find(p => p.from === i); return p ? `<li class="toc-part">${p.name}</li>` : ''; };
    const bm = getBookmark(), cur = spreadOf(idx);
    const row = (s, n, t) => `<li><button type="button" data-s="${s}" ${s === cur ? 'aria-current="true"' : ''}><span class="n">${n}</span><span class="t">${t}</span>${s === bm ? '<span class="bm">Bookmark</span>' : ''}</button></li>`;
    $('toc').innerHTML = row(-1, '—', 'Cover') + spreads.map((s, i) => part(i) + row(i, pad(i + 1), title(s))).join('') + row(N, '—', 'The End') + row(N + 1, '—', 'Credits');
    $('toc').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { closeSheets(); goSpread(+b.dataset.s); }));
  }

  function updateUI() {
    const s = spreadOf(idx);
    const label = s < 0 ? 'Cover' : s > N ? 'Credits' : s === N ? 'The End' : `${pad(s + 1)} / ${N}`;
    $('counter').textContent = label;
    const f = maxIdx ? idx / maxIdx : 0;
    $('p-fill').style.width = $('p-thumb').style.left = `${f * 100}%`;
    $('progress').setAttribute('aria-valuenow', Math.round(f * 100));
    $('progress').setAttribute('aria-valuetext', s < 0 || s >= N ? label : `Page ${s + 1} of ${N}`);
    const marked = getBookmark() === s && s >= 0;
    $('btn-bookmark').classList.toggle('on', marked);
    $('btn-bookmark').setAttribute('aria-label', marked ? 'Remove bookmark' : 'Bookmark this page');
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // --------------------------------------------------
  //  EMBERS (desktop backdrop)
  // --------------------------------------------------
  const cv = $('embers'), cx = cv.getContext('2d');
  let cw = 0, ch = 0, parts = [], raf = 0;
  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth; ch = window.innerHeight;
    cv.width = cw * dpr; cv.height = ch * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const spawn = init => ({ x: Math.random() * cw, y: init ? Math.random() * ch : ch + 10, r: Math.random() * 2 + 0.6, vy: Math.random() * 0.5 + 0.2, sw: Math.random() * 0.6 + 0.2, ph: Math.random() * 6.28, a: Math.random() * 0.6 + 0.3 });
  const embersActive = () => prefs.embers && !isMob && !reduceMotion && !document.hidden;
  function tick() {
    raf = 0;
    cx.clearRect(0, 0, cw, ch);
    if (!embersActive()) return;
    cx.globalCompositeOperation = 'lighter';
    parts.forEach((p, i) => {
      p.y -= p.vy; p.ph += 0.02; p.x += Math.sin(p.ph) * p.sw * 0.5;
      const a = p.a * clamp(p.y / ch, 0, 1);
      cx.fillStyle = `rgba(255,80,20,${a * 0.14})`; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 6.283); cx.fill();
      cx.fillStyle = `rgba(255,170,80,${a})`; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
      if (p.y < -10) parts[i] = spawn(false);
    });
    raf = requestAnimationFrame(tick);
  }
  function startEmbers() {
    if (embersActive()) {
      if (!parts.length) parts = Array.from({ length: 46 }, () => spawn(true));
      if (!raf) raf = requestAnimationFrame(tick);
    } else {
      cx.clearRect(0, 0, cw, ch);
    }
  }

  // --------------------------------------------------
  //  INPUT: tap zones, swipe, keyboard
  // --------------------------------------------------
  let lastSwipe = 0, sx = 0, sy = 0;
  stage.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; }, { passive: true });
  stage.addEventListener('touchend', e => {
    const dx = sx - e.changedTouches[0].screenX, dy = Math.abs(sy - e.changedTouches[0].screenY);
    if (dy < 60 && Math.abs(dx) > 50) { lastSwipe = Date.now(); dx > 0 ? next() : back(); }
  });
  stage.addEventListener('click', e => {
    if (e.target.closest('.again')) return go(0);
    if (Date.now() - lastSwipe < 400 || e.target.closest('button, a')) return;
    const x = e.clientX;
    if (isMob) {
      if (x > window.innerWidth * 0.7) next(); else if (x < window.innerWidth * 0.3) back();
    } else {
      const r = sceneEl.getBoundingClientRect();
      if (x < r.left || x > r.right) return;
      if (idx === 0) return next();          // closed front cover: any click opens it
      x > r.left + r.width / 2 ? next() : back();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return closeSheets();
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target.closest ? e.target : document.body;
    if (t.closest('input, textarea, select') || document.querySelector('.sheet.active')) return;
    const onButton = !!t.closest('button');
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': next(); break;
      case 'ArrowLeft': case 'PageUp': back(); break;
      case ' ': if (onButton) return; e.shiftKey ? back() : next(); break;
      case 'Home': go(0); break;
      case 'End': go(maxIdx); break;
      default: return;
    }
    e.preventDefault();
  });

  // --------------------------------------------------
  //  BOOT
  // --------------------------------------------------
  applyPrefs();
  mountUI();
  sizeCanvas();

  const saved = getBookmark();
  mount(saved !== null ? saved : -1);
  if (saved !== null) toast(`Resumed at page ${pad(saved + 1)}`);
  startEmbers();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      sizeCanvas();
      const m = checkMob();
      if (m !== isMob) { const s = spreadOf(idx); isMob = m; mount(s); }
      else fitDesktop();
      startEmbers();
    }, 80);
  });
  document.addEventListener('visibilitychange', startEmbers);
  if (document.fonts) document.fonts.ready.then(fitStrips);
</script>
</body>
</html>
