<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Little Flame</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --flame-gold: #F2B24C;
    --ember-orange: #D96C2E;
    --volcano-black: #17121C;
    --paper: #F4EFE4;
    --forest-slate: #4A5D53;
    --mist-gray: #A9B3AD;
    --text-size: 1.1rem;
    --line-height: 1.7;
  }
  
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--volcano-black);
    font-family: 'Merriweather', serif;
    overflow: hidden;
    color: #222;
  }

  /* -------------------------------------------
     UNIVERSAL STYLES (Typography & Cover)
  -------------------------------------------- */
  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(3rem, 8vw, 4rem);
    font-weight: 300;
    line-height: 1.1;
    margin: 0 0 16px 0;
    text-align: center;
  }
  h1 em {
    color: var(--flame-gold);
    font-style: italic;
  }
  
  /* Goal 2: Perfect Cover Centering */
  .cover-container {
    background-color: var(--forest-slate) !important;
    color: var(--paper);
    display: flex !important;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding: 20px;
    border: none !important;
  }
  
  .instruction-text {
    font-family: 'Work Sans', sans-serif;
    letter-spacing: 2px;
    font-size: 0.8rem;
    color: var(--mist-gray);
    text-transform: uppercase;
    margin: 0;
  }

  .image-container {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-color: var(--mist-gray);
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--volcano-black);
    font-family: 'Fraunces', serif;
    font-style: italic;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }

  /* -------------------------------------------
     DESKTOP ENGINE STYLES
  -------------------------------------------- */
  #ambient-light {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 100;
    background: radial-gradient(circle 450px at var(--cursor-x, 50vw) var(--cursor-y, 50vh), rgba(242, 178, 76, 0.15), rgba(217, 108, 46, 0.05) 40%, transparent 70%);
    mix-blend-mode: screen;
  }
  .desktop-scene {
    width: 960px; height: 600px;
    perspective: 2000px; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 10;
  }
  .desktop-book { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
  .desktop-page {
    width: 50%; height: 100%; position: absolute; right: 0;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
  }
  .desktop-page.flipped { transform: rotateY(-180deg); }
  .desktop-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; background-color: var(--paper);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.1);
    padding: 40px; box-sizing: border-box; border: 1px solid #d3cec4;
  }
  .desktop-front { transform: rotateY(0deg); border-radius: 0 12px 12px 0; border-left: 2px solid rgba(0,0,0,0.08); }
  .desktop-back { transform: rotateY(180deg); border-radius: 12px 0 0 12px; border-right: 2px solid rgba(0,0,0,0.08); }
  .desktop-text-content {
    width: 100%; height: 100%; overflow-y: auto; padding-right: 12px;
  }
  .desktop-text-content::-webkit-scrollbar { width: 4px; }
  .desktop-text-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  
  .spread-title {
    font-family: 'Fraunces', serif; font-size: 1.4rem; color: #8C3B1B;
    margin-top: 0; margin-bottom: 16px; border-bottom: 1px dashed #d3cec4; padding-bottom: 10px;
  }
  .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #888; margin-bottom: 4px; font-weight: 700; font-family: 'Work Sans', sans-serif; }
  .art-notes { background: rgba(0,0,0,0.03); padding: 16px; border-radius: 6px; margin-top: 16px; font-size: 0.85rem; color: #555; }
  .desktop-story-text { font-size: 0.95rem; line-height: 1.7; margin-bottom: 12px; margin-top: 0; }

  /* -------------------------------------------
     MOBILE ENGINE STYLES
  -------------------------------------------- */
  .mobile-scene { width: 100%; height: 100%; perspective: 2500px; touch-action: none; }
  .mobile-book { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
  .mobile-page {
    width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
    background-color: var(--paper); backface-visibility: hidden;
  }
  .mobile-page.flipped { transform: rotateY(-180deg); }
  .mobile-text-wrapper {
    padding: 100px 30px 40px 30px; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
  }
  .mobile-scroll { width: 100%; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  .mobile-story { font-size: var(--text-size); line-height: var(--line-height); text-align: left; margin-bottom: 20px; }
  .mobile-dialogue {
    font-size: calc(var(--text-size) * 0.95); line-height: var(--line-height);
    color: #444; padding-left: 16px; border-left: 2px solid var(--ember-orange); margin-bottom: 20px;
  }
  
  /* Mobile UI Components */
  .ui-bar {
    position: fixed; top: 0; left: 0; width: 100%; padding: 16px 20px;
    display: flex; justify-content: space-between; box-sizing: border-box; z-index: 100; pointer-events: none;
  }
  .ui-btn {
    background: rgba(23, 18, 28, 0.65); backdrop-filter: blur(8px); border: 1px solid rgba(244, 239, 228, 0.15);
    color: var(--paper); width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; font-size: 1.2rem;
  }
  .settings-panel {
    position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--paper);
    padding: 30px 24px; box-sizing: border-box; border-radius: 20px 20px 0 0; z-index: 101;
    transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }
  .settings-panel.active { bottom: 0; }
  .settings-panel h3 { font-family: 'Fraunces', serif; color: var(--volcano-black); margin: 0 0 20px 0; font-size: 1.4rem; }
  .slider-group { margin-bottom: 24px; }
  .slider-group label { display: block; font-family: 'Work Sans', sans-serif; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; color: #555; margin-bottom: 10px; }
  input[type=range] { width: 100%; accent-color: var(--ember-orange); }
  .close-settings {
    width: 100%; padding: 14px; background: var(--volcano-black); color: var(--paper);
    border: none; border-radius: 8px; font-family: 'Work Sans', sans-serif; font-size: 1rem; text-transform: uppercase; margin-top: 10px;
  }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: var(--flame-gold); color: var(--volcano-black); padding: 12px 24px;
    border-radius: 30px; font-family: 'Work Sans', sans-serif; font-size: 0.85rem; font-weight: 700;
    z-index: 200; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app-root"></div>

  // --------------------------------------------------
  //  DESKTOP RENDERER

  function mountDesktop() {

    let html = `

            </div>

              </div>
            </div>
          </div>
          <div class="desktop-face desktop-back ${isLast ? 'cover-container' : ''}">
            ${isLast ? `
               <h1 style="color: var(--flame-gold); margin:0;">The End</h1>
            ` : `
               <div class="image-container" style="${next.img ? `background-image: url('${next.img}')` : ''}">
                 ${!next.img ? `[ Visual Art: Spread ${i + 2} ]` : ''}
               </div>
            `}
          </div>
        </div>
      `;
    }
    
    html += `</div></div>`;
    appRoot.innerHTML = html;

    // Desktop Click Logic
    const pages = document.querySelectorAll('.desktop-page');
    pages.forEach((page, index) => {
      page.addEventListener('click', () => {
        if (page.classList.contains('flipped')) {
          page.classList.remove('flipped');
          setTimeout(() => { page.style.zIndex = pages.length - index; }, 400); 
        } else {
          page.classList.add('flipped');
          setTimeout(() => { page.style.zIndex = index + 1; }, 400);
        }
      });
    });

    // Ambient Lighting Logic
    const ambient = document.getElementById('ambient-light');
    document.addEventListener('mousemove', (e) => {
      if(ambient) {
        ambient.style.setProperty('--cursor-x', `${e.clientX}px`);
        ambient.style.setProperty('--cursor-y', `${e.clientY}px`);
      }
    });
  }

  // --------------------------------------------------
  //  MOBILE RENDERER
  // --------------------------------------------------
  function mountMobile() {
    let pagesData = [];
    
    // Mobile Cover
    pagesData.push(`
      <div class="mobile-page cover-container">
        <h1>The Little<br><em>Flame</em></h1>
        <p class="instruction-text">Swipe to read</p>
      </div>
    `);

    // Map Single Cards
    spreads.forEach(spread => {
      pagesData.push(`
        <div class="mobile-page">
          <div class="mobile-text-wrapper">
            <div class="mobile-scroll">
              <p class="mobile-story">${spread.story}</p>
              ${spread.dialogue ? `<p class="mobile-dialogue">${spread.dialogue}</p>` : ''}
            </div>
          </div>
        </div>
      `);
      if (spread.img) {
        pagesData.push(`<div class="mobile-page" style="background-image: url('${spread.img}'); background-size: cover; background-position: center; background-color: var(--mist-gray);"></div>`);
      }
    });

    // Mobile End Cover
    pagesData.push(`
      <div class="mobile-page cover-container">
        <h1 style="color: var(--flame-gold); margin:0;">The End</h1>
      </div>
    `);

    let html = `
      <div class="ui-bar">
        <div class="ui-btn" id="btn-settings">Aa</div>
        <div class="ui-btn" id="btn-bookmark">🔖</div>
      </div>
      <div class="settings-panel" id="settings-panel">
        <h3>Typography</h3>
        <div class="slider-group"><label>Text Size</label><input type="range" id="size-slider" min="0.8" max="1.8" step="0.1" value="1.1"></div>
        <div class="slider-group"><label>Line Height</label><input type="range" id="line-slider" min="1.3" max="2.2" step="0.1" value="1.7"></div>
        <button class="close-settings" id="btn-close-settings">Done</button>
      </div>
      <div class="toast" id="toast">Bookmark Saved</div>
      <div class="mobile-scene"><div class="mobile-book" id="m-book">
    `;
    
    let total = pagesData.length;
    pagesData.forEach((page, i) => {
      // Inject reverse z-index directly into the string
      let pageWithZ = page.replace('class="mobile-page"', `class="mobile-page" style="z-index:${total - i};"`);
      html += pageWithZ;
    });

    html += `</div></div>`;
    appRoot.innerHTML = html;

    // Mobile Touch & UI Logic
    const allPages = Array.from(document.querySelectorAll('.mobile-page'));
    let currentIndex = 0;

    function flipNext() {
      if (currentIndex >= allPages.length - 1) return;
      allPages[currentIndex].classList.add('flipped');
      currentIndex++;
    }
    function flipPrev() {
      if (currentIndex <= 0) return;
      currentIndex--;
      allPages[currentIndex].classList.remove('flipped');
    }

    // Touch Swipes
    const mBook = document.getElementById('m-book');
    let touchStartX = 0; let touchStartY = 0;
    mBook.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    mBook.addEventListener('touchend', e => {
      let diffX = touchStartX - e.changedTouches[0].screenX;
      let diffY = Math.abs(touchStartY - e.changedTouches[0].screenY);
      if (diffY < 60 && Math.abs(diffX) > 50) {
        if (diffX > 0) flipNext(); else flipPrev();
      }
    });

    // Tap Zones
    mBook.addEventListener('click', e => {
      const x = e.clientX; const width = window.innerWidth;
      if (x > width * 0.7) flipNext();
      else if (x < width * 0.3) flipPrev();
    });

    // UI Controls
    const root = document.documentElement;
    document.getElementById('btn-settings').addEventListener('click', () => document.getElementById('settings-panel').classList.add('active'));
    document.getElementById('btn-close-settings').addEventListener('click', () => document.getElementById('settings-panel').classList.remove('active'));
    document.getElementById('size-slider').addEventListener('input', e => root.style.setProperty('--text-size', `${e.target.value}rem`));
    document.getElementById('line-slider').addEventListener('input', e => root.style.setProperty('--line-height', e.target.value));

    // Bookmarks
    const toast = document.getElementById('toast');
    const saved = localStorage.getItem('lf-bookmark');
    if (saved !== null) {
      let target = parseInt(saved);
      for(let i = 0; i < target; i++) {
        allPages[i].classList.add('flipped');
        allPages[i].style.transition = 'none'; 
        allPages[i].offsetHeight; 
        allPages[i].style.transition = '';
      }
      currentIndex = target;
      toast.innerText = "Loaded Bookmark";
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    document.getElementById('btn-bookmark').addEventListener('click', () => {
      localStorage.setItem('lf-bookmark', currentIndex);
      toast.innerText = "Bookmark Saved";
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  }

  // --------------------------------------------------
  //  ROUTING ENGINE
  // --------------------------------------------------
  let isCurrentlyMobile = window.innerWidth <= 768;

  function initApp() {
    isCurrentlyMobile = window.innerWidth <= 768;
    if (isCurrentlyMobile) {
      mountMobile();
    } else {
      mountDesktop();
    }
  }

  // Run on load
  initApp();

  // Watch for device rotation or window resizing across the breakpoint
  window.addEventListener('resize', () => {
    const checkMobile = window.innerWidth <= 768;
    if (checkMobile !== isCurrentlyMobile) {
      initApp();
    }
  });

</script>
</body>
</html>
